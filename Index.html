<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Voice Assistant (OpenRouter)</title>
  <style>
    body {
      background-color: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      padding: 20px;
      text-align: center;
    }
    button {
      padding: 12px 20px;
      font-size: 18px;
      background-color: #0984e3;
      color: white;
      border: none;
      border-radius: 8px;
      margin: 10px;
      cursor: pointer;
    }
    #chat {
      max-width: 600px;
      margin: 30px auto;
      text-align: left;
    }
    .user, .ai {
      padding: 10px;
      margin: 10px 0;
      border-radius: 10px;
    }
    .user { background: #2d3436; }
    .ai { background: #00cec9; }
  </style>
</head>
<body>
  <h2>🎙️ AI Voice Assistant (OpenRouter)</h2>
  <button onclick="startListening()">🎤 Speak</button>
  <div id="chat"></div>

  <script>
    const OPENROUTER_API_KEY = "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";

    function startListening() {
      const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
      recognition.lang = 'en-US';
      recognition.start();

      recognition.onresult = function(event) {
        const voiceInput = event.results[0][0].transcript;
        showMessage("You", voiceInput, "user");
        askAI(voiceInput);
      };

      recognition.onerror = function(event) {
        alert("Mic error: " + event.error);
      };
    }

    async function askAI(text) {
      showMessage("AI", "Thinking...", "ai");

      const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${OPENROUTER_API_KEY}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          model: "openai/gpt-3.5-turbo",
          messages: [{ role: "user", content: text }]
        })
      });

      const data = await response.json();
      const reply = data.choices[0].message.content;
      updateLastMessage(reply);
      speak(reply);
    }

    function speak(text) {
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      speechSynthesis.speak(utterance);
    }

    function showMessage(sender, message, className) {
      const chat = document.getElementById("chat");
      const msg = document.createElement("div");
      msg.className = className;
      msg.innerHTML = `<strong>${sender}:</strong> <span class="msg-text">${message}</span>`;
      chat.appendChild(msg);
      window.scrollTo(0, document.body.scrollHeight);
    }

    function updateLastMessage(text) {
      const aiMessages = document.querySelectorAll(".ai .msg-text");
      if (aiMessages.length > 0) {
        aiMessages[aiMessages.length - 1].innerText = text;
      }
    }
  </script>
</body>
</html>
